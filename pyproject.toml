[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sublation"
version = "0.2.0"
description = "Non-boolean truth structures for dialectical reasoning, an alternative to boolean binarism, inspired by Hegelian logic."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Germano Castanho", email = "germanocastanho@proton.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/germanocastanho/sublation-lib"

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.0", "build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
sublation = ["py.typed"]
